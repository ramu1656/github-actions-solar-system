name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env:
  MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}  
permissions: 
        packages: write    
jobs:
    

    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
        - name: Cache NPM dependencies
          uses: actions/cache@v4
          with:
            path: ~/.npm
            key: '${{ runner.os }}-node-modules-${{ hashFiles(''package-lock.json'') }}'
            
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result 
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
         name: code-coverage
         runs-on: ubuntu-latest
         steps:
           - name: Checkout Reposistory
             uses: actions/checkout@v4

           - name: Install NodeJS
             uses: actions/setup-node@v4
             with:
              node-version: 18

           - name: Install Dependencies
             run: npm install
            
           - name: Code-Coverage
             continue-on-error: true
             run : npm run coverage

           - name: upload artifacts
             uses: actions/upload-artifact@v4
             with:
               name: Code-Coverage-Result
               path: coverage
               retention-days: 5

    docker:
      name: Login docker
      runs-on: ubuntu-latest
      needs:
        - unit-testing
        - code-coverage
      steps:
        - name: Code Checkout
          uses: actions/checkout@v4
          
        - name: Docker Login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: '${{ github.repository_owner }}'
            password:  '${{ secrets.GITHUB_TOKEN }}'

        - name: docker build and push
          uses: docker/build-push-action@v4
          with:
            context: .
            push: true
            tags: 'ghcr.io/${{github.repository_owner }}/solar-system:${{ github.sha }}'
    
    dev-deploy:
      needs: docker
      runs-on: ubuntu-latest
      environment:
        name: development
    
      steps:
          - name: Code Checkout
            uses: actions/checkout@v4
          - name: Setup Kubectl  
            uses: azure/setup-kubectl@v3
            with:
              version: v1.26.0
          - name: Setup Kubeconfig
            uses: azure/k8s-set-context@v3
            with:
              method: kubeconfig
              kubeconfig: '${{ secrets.KUBECONFIG }}'
          - name: Check Kubernetes Version    
            run: kubectl version --short -o yaml
          
          - run: >
             echo "INGRESS_IP=$(kubectl -n ingress-nginx get services
             ingress-nginx-controller -o
             jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_ENV
          - uses: cschleiden/replace-tokens@v1
            with:
              tokenPrefix: '_{_'
              tokenSuffix: '_}_'
              files: '["kubernetes/development/*.yaml"]'
            env:
              NAMESPACE: '${{ vars.NAMESPACE }}'
              REPLICAS: '${{ vars.REPLICAS }}'
              IMAGE: >-
                ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha
                }}
              INGRESS_IP: '${{ env.INGRESS_IP }}'
          - run: cat kubernetes/development/*.yaml

    # dev-deploy job
    integration-test:
      needs: dev-deploy
      uses: ./.github/workflows/reusable-workflow.yml
      with:
       ingress-url: ${{ needs.dev-deploy.outputs.APP_INGRESS_URL }}
# next job      
      